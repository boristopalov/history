[project]
name = "history"
version = "0.1.0"
description = "Links location data on this machine with photos, messages, browsing and more."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "icalendar>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
hist = "history.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/history"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
artifacts = ["src/history/server/static"]
